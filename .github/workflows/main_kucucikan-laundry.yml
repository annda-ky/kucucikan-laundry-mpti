# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - kucucikan-laundry

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Memaksa GitHub Actions menggunakan Node 24 untuk menghilangkan peringatan kuning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install, Generate Prisma, and Build
        run: |
          npm install
          npx prisma generate
          npm run build --if-present
        working-directory: api
        env:
          # Memberikan akses database ke Prisma saat proses build
          DATABASE_URL: ${{ secrets.DATABASE_URL }} 

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Mengunggah folder api yang sudah berisi hasil build (dist) dan node_modules
          path: api 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_63E1012625CC4F1D9040A0EDE8C7DE16 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_29A0B38A22524C388E41DA2953692572 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3FD78704E5764A0ABF6DC61C5E6F71B6 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kucucikan-laundry'
          slot-name: 'Production'
          package: .
