# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek Struktur Folder (Buat Debug)
        run: ls -R # Ini buat mastiin folder 'api' beneran ada

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Kita turunin dikit ke 20 biar stabil

      - name: Install & Build
        run: |
          npm install
          npm run build --if-present
        working-directory: api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: api/dist # Biasanya NestJS hasilnya ada di folder dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'kucucikan-laundry'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BANYAK_ANGKA }}
          package: .
